<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buchungskalender | Veranstaltungsservice Baermann</title>
<style>
:root{--ink:#1d2433;--accent:#2547c9;--flash:#ffd23f;--soft:#f3f5fb;--line:#d9deea;--muted:#566074}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.5;background:#fff}
.bk{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{font:inherit;font-weight:700;padding:10px 16px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav h2{margin:0;font-size:1.25em}
.nav button{font:inherit;font-weight:700;width:44px;height:44px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-weight:700;font-size:.85em;color:var(--muted);padding:4px 0}
.d{min-height:56px;border:2px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.d small{font-size:.68em;line-height:1.1}
.d.free{background:#e7f5ea;border-color:#2f8f4e}
.d.part{background:#fff4c2;border-color:#c9a400}
.d.busy{background:#e3e5ea;color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.d.busy small{text-decoration:none}
.d.past{opacity:.35;cursor:not-allowed}
.d.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.d.empty{border:0;background:none;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88em;margin:12px 0 4px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:2px solid;vertical-align:-2px;margin-right:5px}
.note{background:var(--soft);border-left:6px solid var(--accent);border-radius:8px;padding:12px 16px;margin:12px 0}
.ok{background:#e7f5ea;border-left-color:#2f8f4e}
.err{background:#fde8e8;border-left-color:#b42318}
form{margin-top:18px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:auto;margin-top:6px}
.go{margin-top:16px;font:inherit;font-weight:700;padding:14px 26px;border:2px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.hp{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.row{grid-template-columns:1fr}.d{min-height:48px}}
</style>
</head>
<body>
<div class="bk" id="bk">
  <div class="tabs" role="group" aria-label="Leistung wählen" id="tabs"></div>
  <div class="nav"><button type="button" id="prev" aria-label="Voriger Monat">‹</button><h2 id="title" aria-live="polite"></h2><button type="button" id="next" aria-label="Nächster Monat">›</button></div>
  <div class="grid" id="grid"></div>
  <div class="legend"><span><i style="background:#e7f5ea;border-color:#2f8f4e"></i>frei</span><span><i style="background:#fff4c2;border-color:#c9a400"></i>teils belegt (Zeit wird geprüft)</span><span><i style="background:#e3e5ea;border-color:#b8bcc6"></i>belegt</span></div>
  <div class="note" id="info">Wählen Sie einen Tag im Kalender. Ihre Anfrage ist unverbindlich, wir bestätigen den Termin persönlich.</div>
  <form id="form" hidden>
    <h3 id="chosen" style="margin:0 0 4px"></h3>
    <div class="row"><div><label for="start">Beginn (Uhr)</label><input id="start" type="time" value="18:00" required></div>
    <div><label for="hours">Dauer</label><select id="hours"></select></div></div>
    <div class="row"><div><label for="eventType">Eventart</label><select id="eventType"><option>Hochzeit</option><option>Geburtstag</option><option>Firmenfeier</option><option>Vereinsfest</option><option>Sonstiges</option></select></div>
    <div><label for="guests">Gästezahl (ca.)</label><input id="guests" type="number" min="1" max="2000" inputmode="numeric"></div></div>
    <label for="place">Ort der Feier</label><input id="place" autocomplete="off">
    <div class="row"><div><label for="name">Name</label><input id="name" required autocomplete="name"></div>
    <div><label for="phone">Telefon (optional)</label><input id="phone" type="tel" autocomplete="tel"></div></div>
    <label for="email">E-Mail</label><input id="email" type="email" required autocomplete="email">
    <label for="message">Nachricht (optional)</label><textarea id="message" rows="3"></textarea>
    <div class="hp" aria-hidden="true"><input id="gotcha" tabindex="-1" autocomplete="off"></div>
    <label class="chk"><input id="consent" type="checkbox" required><span>Ich stimme zu, dass meine Angaben zur Bearbeitung meiner Anfrage verwendet werden. Mehr dazu in der <a href="#" id="priv" target="_blank" rel="noopener">Datenschutzerklärung</a>.</span></label>
    <button class="go" id="go" type="submit">Unverbindlich anfragen</button>
  </form>
</div>
<script>
// ===== EINSTELLUNGEN =====
const WORKER_URL = "https://DEIN-BUCHUNGS-WORKER.DEINE-SUBDOMAIN.workers.dev";
const PRIVACY_URL = "https://www.djpax.de/datenschutz";
const SERVICES = { dj: "DJ Pax", fotobox: "Fotobox", cocktail: "Cocktailmaschine", technik: "Veranstaltungstechnik" };
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
let svc = "dj", cur = new Date(); cur.setDate(1); let sel = null, partial = false; const cache = {};
$("priv").href = PRIVACY_URL;
$("hours").innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}"${i + 1 === 5 ? " selected" : ""}>${i + 1} Stunde${i ? "n" : ""}</option>`).join("");
$("tabs").innerHTML = Object.entries(SERVICES).map(([k, v]) => `<button type="button" data-s="${k}" aria-pressed="${k === svc}">${v}</button>`).join("");
function say(t, cls) { const n = $("info"); n.className = "note " + (cls || ""); n.textContent = t; resize(); }
function resize() { try { parent.postMessage({ djpaxHeight: document.documentElement.scrollHeight }, "*"); } catch (e) {} }
async function load() {
  const key = svc + ymd(cur); if (cache[key]) return cache[key];
  const to = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  try { const r = await fetch(`${WORKER_URL}?service=${svc}&from=${ymd(cur)}&to=${ymd(to)}`); if (!r.ok) throw 0; return (cache[key] = await r.json()); }
  catch (e) { return { events: [], error: true }; }
}
async function render() {
  $("title").textContent = MONTHS[cur.getMonth()] + " " + cur.getFullYear();
  const data = await load(), today = ymd(new Date());
  const first = (cur.getDay() + 6) % 7, days = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
  let h = ["Mo","Di","Mi","Do","Fr","Sa","So"].map((d) => `<div class="wd">${d}</div>`).join("") + '<div class="d empty"></div>'.repeat(first);
  for (let i = 1; i <= days; i++) {
    const d = new Date(cur.getFullYear(), cur.getMonth(), i), k = ymd(d), n = ymd(new Date(d.getFullYear(), d.getMonth(), i + 1));
    const ev = (data.events || []).filter((e) => e.s < n + "T00:00" && e.e > k + "T00:00");
    let st = k < today ? "past" : ev.some((e) => e.a) ? "busy" : ev.length ? "part" : "free";
    const lab = st === "busy" ? "belegt" : st === "part" ? "teils" : "";
    h += `<button type="button" class="d ${st}${k === sel ? " sel" : ""}" data-d="${k}" data-st="${st}" ${st === "busy" || st === "past" ? "disabled" : ""} aria-label="${i}. ${MONTHS[cur.getMonth()]}${lab ? ", " + lab : ""}">${i}<small>${lab}</small></button>`;
  }
  $("grid").innerHTML = h;
  if (data.error) say("Die Belegung ist gerade nicht abrufbar. Sie können trotzdem eine Anfrage senden.", "err"); else if (!sel) say("Wählen Sie einen Tag im Kalender. Ihre Anfrage ist unverbindlich, wir bestätigen den Termin persönlich.");
  resize();
}
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; svc = b.dataset.s; sel = null; $("form").hidden = true; document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b)); render(); };
$("prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); render(); };
$("next").onclick = () => { cur.setMonth(cur.getMonth() + 1); render(); };
$("grid").onclick = (e) => {
  const b = e.target.closest(".d[data-d]"); if (!b || b.disabled) return;
  sel = b.dataset.d; partial = b.dataset.st === "part";
  const [y, m, d] = sel.split("-"); $("chosen").textContent = `${SERVICES[svc]} am ${+d}. ${MONTHS[+m - 1]} ${y}`;
  $("form").hidden = false; render();
  say(partial ? "An diesem Tag gibt es schon einen Termin. Wir prüfen, ob Ihr Zeitraum passt." : "Tag gewählt. Bitte füllen Sie die Angaben aus.");
  $("form").scrollIntoView({ behavior: "smooth", block: "start" });
};
$("form").onsubmit = async (e) => {
  e.preventDefault(); const go = $("go"); go.disabled = true;
  const body = { service: svc, date: sel, start: $("start").value, hours: +$("hours").value, eventType: $("eventType").value, guests: $("guests").value, place: $("place").value, name: $("name").value, phone: $("phone").value, email: $("email").value, message: $("message").value, consent: $("consent").checked, _gotcha: $("gotcha").value };
  try {
    const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) { say("Vielen Dank! Ihre Anfrage ist bei uns eingegangen. Wir melden uns in Kürze per E-Mail oder Telefon.", "ok"); $("form").hidden = true; sel = null; $("form").reset(); }
    else if (r.status === 409) { Object.keys(cache).forEach((k) => delete cache[k]); say("Dieser Zeitraum ist leider schon belegt. Bitte wählen Sie eine andere Uhrzeit oder einen anderen Tag.", "err"); }
    else throw 0;
  } catch (x) { say("Die Anfrage konnte nicht gesendet werden. Bitte versuchen Sie es erneut oder schreiben Sie uns per WhatsApp: +49 176 84576838.", "err"); }
  go.disabled = false; render();
};
render();
addEventListener("resize", resize);
</script>
</body>
</html>
